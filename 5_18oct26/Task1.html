<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .navbar {
            background: #222;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }

        .links a:hover {
            color: yellow;
        }

        @media (max-width: 500px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .links {
                flex-direction: column;
                align-items: center;
            }
        }

        .box {
            width: 120px;
            height: 120px;
            position: absolute;
        }

        .red {
            background-color: red;
            top: 50px;
            left: 50px;
            z-index: 1;
        }

        .blue {
            background-color: blue;
            top: 80px;
            left: 80px;
            z-index: 2;
        }

        .green {
            background-color: green;
            top: 110px;
            left: 110px;
            z-index: 3;
        }


        .red {
            z-index: 3;
        }

        .blue {
            z-index: 2;
        }

        .green {
            z-index: 1;
        }

        .box-container {
            position: relative;
            margin-top: 20px;
            height: 250px;
        }

        .box {
            width: 120px;
            height: 120px;
            position: absolute;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">Ujjawal</div>

        <div class="links">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </div>


    <div class="box-container">
        <div class="box red"></div>
        <div class="box green"></div>
        <div class="box blue"></div>
    </div>



</body>

</html>
