<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            width: 150px;
            height: 150px;
            position:absolute;
            color: #000;;
            font-width: bold;
        }
        .green{
            background: green;
            top: 50px;
            left:50px;
            z-index: 2;

        }
        .blue{
            background: blue;
            top: 100px;
            left: 100px;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="box green">Green (z-index: 1)</div>
    <div class="box blue">Blue (z-index: 2)</div>
</body>
</html>
