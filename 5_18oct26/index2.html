<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        .stack{
            position:relative;
            width: 300px;
            height: 220px;
            margin: 40px;

        }
        .card{
            position: absolute;
            width: 160px;
            height: 120px;
            color:rgb(220, 226, 226);
            font-family: sans-serif;
            transition: z-index 0s, transform 0.2s;
        }
        .a{
            background: #000;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .b{
            background: #610808;
            top: 50px;
            left: 40px;
            z-index: 2;
        }
        .c{
            background: #5e622e;
            top: 70px;
            left: 80px;
            z-index: 3;
        }
        .card:hover{
            z-index:10;
            transform: scale(1.05);
        }

    </style>



</head>




    <body>
        <div class="stack">
            <div class="card a">Card A (z : 1)</div>
            <div class="card b">Card B (z : 2)</div>
            <div class="card c">Card C (z : 3)</div>
        </div>
    </body>




</html>
