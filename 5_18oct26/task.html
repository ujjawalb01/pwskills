
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }


        .wrapper {
            height: 100vh;
            background-color: #e0f2fe;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: #ff5722;
            color: white;
            font-size: 22px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            background-color: #f1f5f9;
        }

        .item {
            width: 120px;
            height: 120px;
            background-color: #2563eb;
            color: white;
            font-size: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .layout {
            height: 300px;
            display: flex;
            margin: 20px;
        }

        .sidebar {
            width: 200px;
            background-color: #1e293b;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            background-color: #dbeafe;
            flex-grow: 1;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ads {
            width: 150px;
            background-color: #facc15;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>


    <div class="wrapper">
        <div class="box">
            I'm centered!
        </div>
    </div>


    <div class="gallery">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item">7</div>
        <div class="item">8</div>
    </div>


    <div class="layout">

        <div class="sidebar">
            Sidebar
        </div>

        <div class="main">
            Main Content
        </div>

        <div class="ads">
            Ads
        </div>

    </div>

</body>
</html>
