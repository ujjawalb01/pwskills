<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 80px;
            height: 80px;
            background: #4f46e5;
            margin: 50px;
            border-radius: 10px;
            animation: move 2s infinite alternate;
        }

        @keyframes move {
            from {
                transform: translateX(0);
                background: #4f46e5;
            }

            to {
                transform: translateX(200px);
                background: #ec4899;
            }
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>

</html>
